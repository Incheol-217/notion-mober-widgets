<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>발표 순서 뽑기 | 모베르</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#242e2a;background:#faf8f3;color-scheme:light;line-height:1.45}*{box-sizing:border-box}body{margin:0;padding:clamp(8px,3vw,18px)}main{max-width:29rem;margin:0 auto;background:#fff;border:1px solid #dedbd1;border-radius:18px;padding:clamp(14px,5vw,24px)}.kicker{color:#126454;letter-spacing:.13em;font-size:.7rem;font-weight:750;margin:0 0 8px}h1{font-size:clamp(1.4rem,6vw,1.9rem);letter-spacing:-.04em;line-height:1.22;margin:0}.intro{margin:6px 0 18px;color:#55625d;font-size:.88rem}label[for=list]{display:block;font-size:.9rem;font-weight:700;margin-bottom:5px}textarea{font:inherit;font-size:1rem;color:inherit;background:#fdfdfa;width:100%;min-height:5.3rem;padding:8px 11px;border:1px solid #a6b4aa;border-radius:9px;resize:vertical;display:block}textarea::placeholder{color:#637168}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:9px 14px;font-weight:700;min-height:42px;color:#fff;background:#126454}button:hover{background:#0d5044}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions button:first-child{flex:1}.result-box{background:#edf5ee;border:1px solid #cfe1d2;border-radius:12px;padding:10px 14px}.caption{font-size:.74rem;letter-spacing:.06em;color:#476457;font-weight:700;margin:0 0 3px}output{display:block;font-size:clamp(1.16rem,5vw,1.55rem);font-weight:750;color:#17483d;overflow-wrap:anywhere}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #be6918;outline-offset:2px}
.round-option{margin-top:10px;display:flex;gap:8px;align-items:center;min-height:32px;font-size:.9rem;font-weight:650;cursor:pointer}.round-option input{width:18px;height:18px;accent-color:#126454}.round-info{font-size:.8rem;color:#476457;margin:4px 0 0;line-height:1.5}.actions .secondary{color:#17483d;border:1px solid #a7beb2;background:#fff}.actions .secondary:hover{background:#f0f6f1}button:disabled{background:#d6e1d9;color:#48574f;cursor:default}[hidden]{display:none!important}
</style>
</head>
<body><main aria-labelledby="title">
<p class="kicker" lang="en">MOBER STUDIO / 01</p>
<h1 id="title">발표 순서 뽑기</h1><p class="intro">이름을 한 줄에 하나씩 적고 발표자를 뽑아 보세요.</p>
<label for="list">후보 명단</label><textarea id="list" rows="3" placeholder="예: 바다&#10;하늘&#10;구름" spellcheck="false"></textarea>
<label class="round-option"><input type="checkbox" id="once" aria-describedby="round-info">한 번씩 뽑기</label>
<p id="round-info" class="round-info">켜면 같은 이름은 한 라운드에 한 번만 나와요.</p>
<div class="actions"><button type="button" id="draw">뽑기</button><button type="button" id="new-round" class="secondary" hidden>새 라운드</button></div>
<div class="result-box"><p class="caption" id="caption">뽑기 결과</p><output id="result" aria-labelledby="caption" aria-live="polite" aria-atomic="true">아직 뽑기 전이에요.</output></div>
</main><script>
const list=document.getElementById('list'), draw=document.getElementById('draw'), result=document.getElementById('result');
// 줄마다 양끝 공백을 지우고, 이름이 없는 줄은 뽑기에서 제외합니다.
function names(){return list.value.split(/\r?\n/).map(line=>line.trim()).filter(Boolean);}
// 0 이상 1 미만의 난수를 후보 배열의 위치로 바꿉니다. 후보가 하나면 항상 0입니다.
function pick(items){return items[Math.floor(Math.random()*items.length)];}
const once=document.getElementById('once'), nextRound=document.getElementById('new-round'), info=document.getElementById('round-info');
// 일반 뽑기는 그대로 두고, 한 번씩 뽑을 때만 사용한 이름을 이 라운드 동안 기억합니다.
const used=new Set();
function pool(){return [...new Set(names())];} // 같은 이름을 두 줄에 적어도 한 명입니다.
let listId='[]';
function updateRound(){
  const all=pool(), left=all.length-used.size;
  nextRound.hidden=!once.checked;
  draw.disabled=once.checked && all.length>0 && left===0;
  info.textContent=!once.checked?'켜면 같은 이름은 한 라운드에 한 번만 나와요.':
    all.length===0?'먼저 후보 명단을 적어 주세요.':
    left>0?'남은 후보 '+left+' / '+all.length+'명':'모두 뽑았어요. 새 라운드를 시작할 수 있어요.';
}
function restart(message){used.clear();listId=JSON.stringify(pool());result.textContent=message;updateRound();}
once.addEventListener('change',()=>restart(once.checked?'한 번씩 뽑기를 시작해요.':'일반 뽑기로 돌아왔어요.'));
nextRound.addEventListener('click',()=>restart('새 라운드예요. 뽑기를 눌러 주세요.'));
// 실제 명단이 바뀌면 지난 라운드의 이름이 새 명단에 섞이지 않게 비웁니다.
list.addEventListener('input',()=>{const id=JSON.stringify(pool());if(once.checked && id!==listId){restart('바뀐 명단으로 새로 뽑아요.');}else{listId=id;updateRound();}});
draw.addEventListener('click',()=>{
  const candidates=once.checked?pool().filter(name=>!used.has(name)):names();
  if(!candidates.length){result.textContent='후보를 한 명 이상 입력해 주세요.';return;}
  const winner=pick(candidates);result.textContent=winner;
  if(once.checked)used.add(winner);
  updateRound();
});
updateRound();
</script></body></html>
